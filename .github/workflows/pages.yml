name: Build

# The site is hosted on Hostinger (docs/deploy.md). CI builds it, checks every item and keeps the
# static build as a downloadable artifact, ready to upload.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - run: npm run check
      - name: Generated files are in sync
        run: |
          git diff --exit-code registry.json README.md site/public/llms.txt || (echo "Generated files are out of sync. Run npm run sync." && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: mangacn-site
          path: site/dist
          include-hidden-files: true
          retention-days: 14
