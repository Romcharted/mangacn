name: Component request
description: A shadcn component not dressed yet, a new manga piece, or a new look for an existing one.
labels: ["component"]
body:
  - type: input
    id: name
    attributes:
      label: Component
      placeholder: "e.g. a shadcn component, or a manga piece like a sound-effect ticker"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it is for
      description: The interface where you need it.
    validations:
      required: true
  - type: textarea
    id: look
    attributes:
      label: How it should read in ink
      description: >
        Which of the eight gestures it would use (case, flat, hover, impact, pop, bubble, motion, marks — see
        AGENTS.md). If it needs something the grammar does not cover, say so: new rules are agreed here, never
        invented in a pull request. Sketches welcome; no copied artwork.
