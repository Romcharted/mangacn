# nginx for the showcase: the same rules as site/public/.htaccess (Apache), for the Coolify container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  charset_types text/plain application/json application/javascript text/css image/svg+xml;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Registry files and llms.txt are read by the shadcn CLI, its MCP server and AI tools.
  location ~* \.(json|txt)$ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Vite gives scripts, styles and fonts a hashed name: they can be cached for good.
  location ~* \.(js|css|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Any other file (art/x.webp, og.png): served as is, 404 when missing.
  location ~ \.[A-Za-z0-9]+$ {
    try_files $uri =404;
  }

  # The site uses real paths (/docs/components/button): an address without a file extension gets index.html,
  # which shows the right page.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
